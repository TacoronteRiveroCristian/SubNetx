  #   container_name: subnetx_ui
  #   volumes:
  #     - ./ui:/app
  #     - ui_node_modules:/app/node_modules
  #     - ui_next_cache:/app/.next
  #   ports:
  #     - "3200:3200"
  #   environment:
  #     - NODE_ENV=development
  #     - NEXT_PUBLIC_API_URL=http://subnetx_vpn:8000
  #     - WATCHPACK_POLLING=true
  #     - CHOKIDAR_USEPOLLING=true
