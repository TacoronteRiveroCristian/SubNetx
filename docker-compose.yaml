version: '3.8'

services:
  subnetx:
    build:
      context: .
      dockerfile: ./services/vpn/Dockerfile
    container_name: subnetx_vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    privileged: true
    volumes:
      - ./docker/volumes/certs:/etc/openvpn/certs
      - ./docker/volumes/logs:/var/log/openvpn
    ports:
      - ${OPENVPN_PORT}:${OPENVPN_PORT}/${OPENVPN_PROTO}
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    networks:
      - subnetx
    depends_on:
      postgres:
        condition: service_healthy

  duckdns:
    image: linuxserver/duckdns
    container_name: subnetx_duckdns
    restart: unless-stopped
    environment:
      - SUBDOMAINS=${PUBLIC_IP}
      - TOKEN=${DUCKDNS_TOKEN}
    networks:
      - subnetx

  # ui:
  #   build:
